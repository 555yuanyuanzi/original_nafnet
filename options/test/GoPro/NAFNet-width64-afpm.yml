# general settings
name: NAFNet-GoPro-width64-AFPM-test
model_type: ImageRestorationModel
scale: 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:

  test:
    name: gopro-test
    type: PairedImageDataset

    dataroot_gt: ./datasets/GoPro/test/target.lmdb
    dataroot_lq: ./datasets/GoPro/test/input.lmdb

    io_backend:
      type: lmdb

# network structures
network_g:
  type: NAFNetLocal
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  use_fft: true
  fft_stages: [enc1, enc2, enc3, dec2, dec3, dec4]
  use_afpm_refiner: true
  afpm_refiner_stages: [dec1, dec2, dec3, dec4]
  afpm_refiner_kwargs:
    patch_size: 8
    expansion: 1.0
    scale_limit: 0.2
    patch_gate_limit: 0.5
    channel_gate_limit: 0.25

# path
path:
  pretrain_network_g: experiments/NAFNet-GoPro-width64-AFPM/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: true
  grids: false


  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500
